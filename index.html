<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>StandBy 3D Flip Clock</title>
  <!-- Google Fonts: Barlow Condensed (500, 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --card-bg: #000000;
      --text: #f2f2f2;
      --subtext: #d8d8dc;
      --hinge: #000000;
      --card-w: clamp(92px, 14vw, 185px);
      --card-h: clamp(180px, 30vw, 360px);
      --font-size: clamp(170px, 28vw, 340px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3vh, 32px);
    }

    /* Top Date Header */
    .date {
      font-size: clamp(18px, 2.5vw, 30px);
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--subtext);
      text-transform: uppercase;
      padding-left: 0.22em;
    }

    /* Main Clock Row */
    .clock {
      display: flex;
      align-items: center;
      gap: clamp(36px, 7vw, 110px);
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2.4vh, 26px);
    }

    .digits {
      display: flex;
      gap: clamp(8px, 1.5vw, 22px);
    }

    .label {
      font-size: clamp(15px, 1.9vw, 23px);
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--subtext);
      text-transform: uppercase;
      padding-left: 0.22em;
    }

    /* Individual 3D Flip Card — isolated GPU layer prevents sub-pixel pulse */
    .flip-card {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1000px;
      -webkit-perspective: 1000px;
      background: var(--card-bg);
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      contain: layout paint;
    }

    .half,
    .flap {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background: var(--card-bg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .half span,
    .flap span {
      position: absolute;
      left: 0;
      width: 100%;
      height: var(--card-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size);
      font-weight: 500;
      line-height: 1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      /* Optical vertical centering so the 4px hinge line cuts dead-center through the waist of 8 */
      transform: translate3d(0, -2.8%, 0);
      -webkit-transform: translate3d(0, -2.8%, 0);
    }

    .top,
    .flap-top {
      top: 0;
    }

    .top span,
    .flap-top span {
      top: 0;
    }

    .bottom,
    .flap-bottom {
      bottom: 0;
    }

    .bottom span,
    .flap-bottom span {
      bottom: 0;
    }

    /* Animated 3D Flaps (controlled sequentially via JS) */
    .flap-top {
      z-index: 3;
      transform-origin: 50% 100%;
      -webkit-transform-origin: 50% 100%;
      visibility: hidden;
      will-change: transform;
    }

    .flap-bottom {
      z-index: 4;
      transform-origin: 50% 0%;
      -webkit-transform-origin: 50% 0%;
      visibility: hidden;
      will-change: transform;
    }

    /* Crisp 4px Center Hinge Line */
    .hinge {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--hinge);
      transform: translate3d(0, -50%, 1px);
      -webkit-transform: translate3d(0, -50%, 1px);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="date" id="date">15.11 SUNDAY</div>

    <div class="clock">
      <div class="unit">
        <div class="digits">
          <div class="flip-card" id="h1"></div>
          <div class="flip-card" id="h2"></div>
        </div>
        <div class="label">HOUR</div>
      </div>

      <div class="unit">
        <div class="digits">
          <div class="flip-card" id="m1"></div>
          <div class="flip-card" id="m2"></div>
        </div>
        <div class="label">MIN</div>
      </div>
    </div>
  </div>

  <script>
    const DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
    const cards = {};
    const HALF_DURATION = 210; // ms per half-fold (420ms total)

    // Snap card dimensions to even integer pixels to eliminate Safari sub-pixel jitter
    function snapCardMetrics() {
      const vw = window.innerWidth;
      const rawW = Math.min(185, Math.max(92, vw * 0.14));
      const rawH = Math.min(360, Math.max(180, vw * 0.3));
      const evenW = Math.round(rawW / 2) * 2;
      const evenH = Math.round(rawH / 2) * 2;
      document.documentElement.style.setProperty('--card-w', `${evenW}px`);
      document.documentElement.style.setProperty('--card-h', `${evenH}px`);
    }
    snapCardMetrics();
    window.addEventListener('resize', snapCardMetrics);

    // Build DOM layers for each digit card
    function initCard(id, initialVal) {
      const el = document.getElementById(id);
      el.innerHTML = `
        <div class="half top"><span>${initialVal}</span></div>
        <div class="half bottom"><span>${initialVal}</span></div>
        <div class="flap flap-top"><span>${initialVal}</span></div>
        <div class="flap flap-bottom"><span>${initialVal}</span></div>
        <div class="hinge"></div>
      `;
      cards[id] = {
        el,
        val: initialVal,
        topSpan: el.querySelector('.top span'),
        bottomSpan: el.querySelector('.bottom span'),
        flapTop: el.querySelector('.flap-top'),
        flapBottom: el.querySelector('.flap-bottom'),
        flapTopSpan: el.querySelector('.flap-top span'),
        flapBottomSpan: el.querySelector('.flap-bottom span'),
        animTop: null,
        animBottom: null
      };
    }

    // Sequential 2-stage 3D mechanical fold
    function flipTo(id, nextVal) {
      const card = cards[id];
      if (!card || card.val === nextVal) return;

      const prevVal = card.val;
      card.val = nextVal;

      if (card.animTop) card.animTop.cancel();
      if (card.animBottom) card.animBottom.cancel();

      card.topSpan.textContent = nextVal;
      card.bottomSpan.textContent = prevVal;

      card.flapTopSpan.textContent = prevVal;
      card.flapBottomSpan.textContent = nextVal;
      card.flapBottom.style.visibility = 'hidden';
      card.flapTop.style.visibility = 'visible';

      card.animTop = card.flapTop.animate(
        [
          { transform: 'rotateX(0deg)', filter: 'brightness(1)' },
          { transform: 'rotateX(-90deg)', filter: 'brightness(0.4)' }
        ],
        {
          duration: HALF_DURATION,
          easing: 'ease-in',
          fill: 'forwards'
        }
      );

      card.animTop.onfinish = () => {
        card.flapTop.style.visibility = 'hidden';
        card.flapBottom.style.visibility = 'visible';

        card.animBottom = card.flapBottom.animate(
          [
            { transform: 'rotateX(90deg)', filter: 'brightness(0.4)' },
            { transform: 'rotateX(0deg)', filter: 'brightness(1)' }
          ],
          {
            duration: HALF_DURATION,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );

        card.animBottom.onfinish = () => {
          card.bottomSpan.textContent = nextVal;
          card.flapBottom.style.visibility = 'hidden';
        };
      };
    }

    function getTimeParts() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dayName = DAYS[now.getDay()];

      return {
        h1: h[0], h2: h[1],
        m1: m[0], m2: m[1],
        dateStr: `${dd}.${mm} ${dayName}`
      };
    }

    // Initialize immediately on load
    const initial = getTimeParts();
    ['h1', 'h2', 'm1', 'm2'].forEach(key => initCard(key, initial[key]));
    document.getElementById('date').textContent = initial.dateStr;

    function updateClock() {
      const t = getTimeParts();
      flipTo('h1', t.h1);
      flipTo('h2', t.h2);
      flipTo('m1', t.m1);
      flipTo('m2', t.m2);

      const dateEl = document.getElementById('date');
      if (dateEl.textContent !== t.dateStr) {
        dateEl.textContent = t.dateStr;
      }
    }

    setInterval(updateClock, 500);

    // Keep screen awake via Wake Lock API
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();
  </script>
</body>
</html>
