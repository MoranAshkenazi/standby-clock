<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>StandBy Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --text: #f2f2f2;
      --subtext: #d8d8dc;
      --hinge: #000000;
      --card-w: clamp(78px, 11.5vw, 148px);
      --card-h: clamp(160px, 26vw, 310px);
      --font-size: clamp(150px, 24vw, 290px);
      --flip-speed: 0.45s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Barlow Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3vh, 32px);
    }

    .date {
      font-size: clamp(18px, 2.5vw, 30px);
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--subtext);
      text-transform: uppercase;
      padding-left: 0.22em;
    }

    .clock {
      display: flex;
      align-items: center;
      gap: clamp(32px, 5.8vw, 84px);
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2.4vh, 26px);
    }

    .digits {
      display: flex;
      gap: clamp(8px, 1.3vw, 18px);
    }

    .label {
      font-size: clamp(15px, 1.9vw, 23px);
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--subtext);
      text-transform: uppercase;
      padding-left: 0.22em;
    }

    /* 3D Flip Digit Container */
    .flip-card {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1000px;
      background: var(--bg);
    }

    .half,
    .flap {
      position: absolute;
      left: 0;
      width: 100%;
      height: 58%;
      overflow: hidden;
      background: var(--bg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .half span,
    .flap span {
      position: absolute;
      left: 0;
      width: 100%;
      height: var(--card-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size);
      font-weight: 700;
      line-height: 1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      /* Optical vertical centering so the black split line cuts right through the middle */
      transform: translateY(-1.5%);
    }

    .top,
    .flap-top {
      top: 0;
    }

    .top span,
    .flap-top span {
      top: 0;
    }

    .bottom,
    .flap-bottom {
      bottom: 0;
    }

    .bottom span,
    .flap-bottom span {
      bottom: 0;
    }

    /* Animated Flaps */
    .flap-top {
      z-index: 3;
      transform-origin: 50% 100%;
      transform: rotateX(0deg);
    }

    .flap-bottom {
      z-index: 4;
      transform-origin: 50% 0%;
      transform: rotateX(90deg);
    }

    .flip-card.flipping .flap-top {
      animation: foldTop calc(var(--flip-speed) / 2) ease-in forwards;
    }

    .flip-card.flipping .flap-bottom {
      animation: foldBottom calc(var(--flip-speed) / 2) ease-out calc(var(--flip-speed) / 2) forwards;
    }

    @keyframes foldTop {
      0% {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
      100% {
        transform: rotateX(-90deg);
        filter: brightness(0.4);
      }
    }

    @keyframes foldBottom {
      0% {
        transform: rotateX(90deg);
        filter: brightness(0.4);
      }
      100% {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
    }

    /* Center Split Line */
    .hinge {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--hinge);
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="date" id="date">15.11 SUNDAY</div>

    <div class="clock">
      <div class="unit">
        <div class="digits">
          <div class="flip-card" id="h1"></div>
          <div class="flip-card" id="h2"></div>
        </div>
        <div class="label">HOUR</div>
      </div>

      <div class="unit">
        <div class="digits">
          <div class="flip-card" id="m1"></div>
          <div class="flip-card" id="m2"></div>
        </div>
        <div class="label">MIN</div>
      </div>

      <div class="unit">
        <div class="digits">
          <div class="flip-card" id="s1"></div>
          <div class="flip-card" id="s2"></div>
        </div>
        <div class="label">SEC</div>
      </div>
    </div>
  </div>

  <script>
    const DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
    const cards = {};

    function initCard(id, initialVal) {
      const el = document.getElementById(id);
      el.innerHTML = `
        <div class="half top"><span>${initialVal}</span></div>
        <div class="half bottom"><span>${initialVal}</span></div>
        <div class="flap flap-top"><span>${initialVal}</span></div>
        <div class="flap flap-bottom"><span>${initialVal}</span></div>
        <div class="hinge"></div>
      `;
      cards[id] = {
        el,
        val: initialVal,
        topSpan: el.querySelector('.top span'),
        bottomSpan: el.querySelector('.bottom span'),
        flapTopSpan: el.querySelector('.flap-top span'),
        flapBottomSpan: el.querySelector('.flap-bottom span'),
        timer: null
      };
    }

    function flipTo(id, nextVal) {
      const card = cards[id];
      if (!card || card.val === nextVal) return;

      const prevVal = card.val;
      card.val = nextVal;

      if (card.timer) {
        clearTimeout(card.timer);
      }

      card.el.classList.remove('flipping');
      void card.el.offsetWidth;

      card.topSpan.textContent = nextVal;
      card.bottomSpan.textContent = prevVal;
      card.flapTopSpan.textContent = prevVal;
      card.flapBottomSpan.textContent = nextVal;

      card.el.classList.add('flipping');

      card.timer = setTimeout(() => {
        card.bottomSpan.textContent = nextVal;
        card.flapTopSpan.textContent = nextVal;
        card.el.classList.remove('flipping');
      }, 460);
    }

    function getTimeParts() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dayName = DAYS[now.getDay()];

      return {
        h1: h[0], h2: h[1],
        m1: m[0], m2: m[1],
        s1: s[0], s2: s[1],
        dateStr: `${dd}.${mm} ${dayName}`
      };
    }

    const initial = getTimeParts();
    ['h1', 'h2', 'm1', 'm2', 's1', 's2'].forEach(key => initCard(key, initial[key]));
    document.getElementById('date').textContent = initial.dateStr;

    function updateClock() {
      const t = getTimeParts();
      flipTo('h1', t.h1);
      flipTo('h2', t.h2);
      flipTo('m1', t.m1);
      flipTo('m2', t.m2);
      flipTo('s1', t.s1);
      flipTo('s2', t.s2);

      const dateEl = document.getElementById('date');
      if (dateEl.textContent !== t.dateStr) {
        dateEl.textContent = t.dateStr;
      }
    }

    setInterval(updateClock, 250);

    // Keep iPad screen awake while charging
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();
  </script>
</body>
</html>
